<div class="drawer" [class.lg:drawer-open]="isOpen()">
  <input
    #drawerCheckbox
    [id]="drawerId()"
    type="checkbox"
    class="drawer-toggle"
    [checked]="isOpen()"
  />

  <div class="drawer-content flex flex-col mx-auto max-w-7xl w-full">
    <ng-content select="[drawer-content]"></ng-content>
  </div>

  <div class="drawer-side z-20">
    <label [for]="drawerId()" aria-hidden="true" class="drawer-overlay"></label>
    <div class="bg-app-bg-dark min-h-full p-4" [style.width]="sidebarWidth()">
      @if (sidebarTitle()) {
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <h2 class="text-lg font-bold">{{ sidebarTitle() }}</h2>

            @if (sidebarTitleBadge()) {
              <button
                type="button"
                class="badge badge-primary badge-sm cursor-pointer gap-1 hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-base-content"
                [attr.aria-label]="
                  'Wis alle filters (' + sidebarTitleBadge() + ')'
                "
                (click)="clearAllFilters.emit()"
              >
                <span>{{ sidebarTitleBadge() }}</span>
                <ng-icon [svg]="featherX" size="12" aria-hidden="true" />
              </button>
            }
          </div>
          <app-drawer-toggle-button
            [drawerId]="drawerId()"
            [isOpen]="isOpen()"
            (toggle)="toggleDrawer()"
            buttonClass="btn btn-sm btn-circle btn-ghost"
            [icon]="featherX"
            iconSize="20"
            [iconOnly]="true"
          />
        </div>
      }
      <ng-content select="[drawer-sidebar]"></ng-content>
    </div>
  </div>
</div>

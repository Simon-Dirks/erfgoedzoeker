<div class="collapse collapse-arrow rounded-none bg-base-100">
  <input
    type="checkbox"
    class="peer"
    [attr.aria-label]="'Filter ' + label() + ' in-/uitklappen'"
  />
  <div
    class="collapse-title flex items-center justify-between font-semibold text-sm capitalize"
  >
    <span class="flex items-center gap-2">
      @if (icon()) {
        <ng-icon
          class="flex-shrink-0 inline-flex items-center"
          [svg]="icon()!"
          size="16"
        />
      }
      <span>{{ label() }}</span>
    </span>
    @if (activeBadge()) {
      <button
        type="button"
        class="badge badge-primary badge-sm relative z-10 cursor-pointer gap-1 lowercase hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-base-content"
        [attr.aria-label]="'Wis filter ' + label() + ' (' + activeBadge() + ')'"
        (click)="clear.emit()"
      >
        <span>{{ activeBadge() }}</span>
        <ng-icon [svg]="featherX" size="12" aria-hidden="true" />
      </button>
    }
  </div>
  <div class="collapse-content min-w-0">
    <ng-content />
  </div>
</div>

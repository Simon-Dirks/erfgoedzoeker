<div class="space-y-1">
  @for (item of allVisibleFilters(); track item.name) {
    @if (item.kind === 'range') {
      <app-range-filter
        [name]="item.config.name"
        [label]="filtersService.getLabel(item.config.name)"
        [icon]="filtersService.getIcon(item.config.name)"
        [filterType]="item.config.type"
      />
    } @else {
      <app-facet-filter
        [facet]="item.facet"
        [label]="filtersService.getLabel(item.facet.name)"
        [icon]="filtersService.getIcon(item.facet.name)"
      />
    }
  }
</div>

@if (!hasFiltersToShow()) {
  <div class="text-center py-4 text-base-content/60">
    Geen filters beschikbaar
  </div>
}

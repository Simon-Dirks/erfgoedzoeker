@for (creator of normalizedCreators(); track $index; let isLast = $last) {
  <div class="inline-flex flex-col" [class.mr-2]="!isLast">
    <app-link-widget
      [node]="creator.nodeWithCreators"
      property="creators"
      [options]="{ showPropertyLabel: false }"
    />

    @if (creator.role.length > 0) {
      <span class="text-sm text-base-content/60">
        {{ creator.role.join(', ') }}
      </span>
    }
  </div>
}

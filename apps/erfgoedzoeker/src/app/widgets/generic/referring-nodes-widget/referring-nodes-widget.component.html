@if (error()) {
  <app-error-alert [message]="error()!" />
}
@if (hasResults()) {
  <div
    class="space-y-2"
    [class.opacity-50]="loading()"
    [attr.aria-busy]="loading()"
  >
    <div class="text-sm text-gray-600 mb-2">
      {{ totalReferringNodes() }}
      {{
        totalReferringNodes() === 1 ? 'object verwijst' : 'objecten verwijzen'
      }}
      naar {{ nodeName() }}
    </div>

    <app-node-link-list [nodes]="referringNodes()" [mode]="'image-card'" />

    <app-pagination
      [label]="'Paginering van verwijzende objecten'"
      [currentPage]="currentPage()"
      [totalItems]="totalReferringNodes()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="currentPage.set($event)"
      (pageSizeChange)="changePageSize($event)"
    />
  </div>
} @else if (loading()) {
  <app-loading-spinner size="md" [centered]="false" />
}

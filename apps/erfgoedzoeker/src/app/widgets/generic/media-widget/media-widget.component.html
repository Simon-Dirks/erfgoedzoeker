@if (displayMode() === 'iiif') {
  @switch (viewerType()) {
    @case ('tify') {
      <app-tify-iiif-widget
        [node]="node()"
        [property]="iiifProperty()"
        [options]="options()"
      />
    }
    @case ('universalviewer') {
      <app-universalviewer-iiif-widget
        [node]="node()"
        [property]="iiifProperty()"
        [options]="options()"
      />
    }
  }
} @else if (displayMode() === 'image') {
  <app-image-gallery-widget
    [node]="node()"
    [property]="imageProperty()"
    [options]="options()"
  />
}

@if (totalPages() > 1) {
<nav
  class="flex flex-col items-center gap-4 mt-8 font-sans sm:flex-row sm:justify-between"
  role="navigation"
  [attr.aria-label]="label()"
>
  <div class="flex items-center gap-1 order-2 sm:order-1">
    <label [for]="pageSizeSelectId" class="sr-only">
      Resultaten per pagina
    </label>
    <select
      [id]="pageSizeSelectId"
      class="select select-sm"
      (change)="onPageSizeChange($event)"
    >
      @for (option of selectablePageSizes(); track option) {
      <option [value]="option" [selected]="option === pageSize()">
        {{ option }} per pagina
      </option>
      }
    </select>
  </div>

  <div class="flex items-center gap-2 order-1 sm:order-2">
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-disabled]="!hasPrevious()"
      [attr.aria-disabled]="!hasPrevious()"
      aria-label="Vorige pagina"
      (click)="goToPrevious()"
    >
      <ng-icon name="featherChevronLeft" size="20" aria-hidden="true" />
    </button>

    <div class="flex items-center gap-1">
      <label [for]="pageInputId" class="sr-only"> Ga naar pagina </label>
      <input
        [id]="pageInputId"
        type="number"
        min="1"
        [max]="totalPages()"
        [value]="currentPage()"
        (keydown.enter)="
          goToInputPage($any($event.target).value, $any($event.target))
        "
        (blur)="goToInputPage($any($event.target).value, $any($event.target))"
        class="input input-sm w-20 text-center px-1"
      />
      <span>van {{ totalPages() }}</span>
    </div>

    <button
      type="button"
      class="btn btn-sm"
      [class.btn-disabled]="!hasNext()"
      [attr.aria-disabled]="!hasNext()"
      aria-label="Volgende pagina"
      (click)="goToNext()"
    >
      <ng-icon name="featherChevronRight" size="20" aria-hidden="true" />
    </button>
  </div>
</nav>
}

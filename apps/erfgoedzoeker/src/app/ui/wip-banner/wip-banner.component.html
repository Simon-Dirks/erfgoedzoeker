@if (!isDismissed()) {
  <div
    #banner
    class="fixed inset-x-0 bottom-0 z-30 flex items-center justify-center gap-2 text-center text-xs sm:text-sm text-base-content/70 bg-base-200 border-t border-base-300 py-2 pl-4 pr-10 h-auto"
  >
    <ng-icon name="featherInfo" size="14" class="shrink-0" aria-hidden="true" />
    <span>
      Deze omgeving is onder
      <a
        href="https://github.com/Simon-Dirks/erfgoedzoeker"
        target="_blank"
        class="link"
        >ontwikkeling</a
      >, functionaliteiten werken mogelijk nog niet zoals verwacht.
    </span>
    <button
      type="button"
      class="btn btn-ghost btn-xs absolute right-2 top-1"
      aria-label="Melding sluiten"
      (click)="dismiss()"
    >
      <ng-icon name="featherX" size="14" aria-hidden="true" />
    </button>
  </div>
}

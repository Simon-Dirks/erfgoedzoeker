fragment DatasetReferenceFields on DatasetReference {
  id
  name {
    value
    language
  }
  publisher {
    ...PublisherReferenceFields
  }
  license
  description {
    value
    language
  }
  landingPage
}

fragment PersonReferenceFields on PersonReference {
  id
  name {
    value
    language
  }
  birthDate
  birthPlace {
    ...PlaceReferenceFields
  }
  deathDate
  deathPlace {
    ...PlaceReferenceFields
  }
  hasOccupation {
    ...OccupationReferenceFields
  }
  alternateName {
    value
    language
  }
  authority
  fetchedAt
}

fragment OrganizationReferenceFields on OrganizationReference {
  id
  name {
    value
    language
  }
  location {
    ...PlaceReferenceFields
  }
  alternateName {
    value
    language
  }
  authority
  fetchedAt
}

fragment PersonOrOrganizationReferenceFields on PersonOrOrganizationReference {
  id
  name {
    value
    language
  }
  ... on PersonReference {
    ...PersonReferenceFields
  }
  ... on OrganizationReference {
    ...OrganizationReferenceFields
  }
}

fragment PlaceReferenceFields on PlaceReference {
  id
  latitude
  longitude
  addressCountry
  addressLocality
  addressRegion
  authority
  fetchedAt
  name {
    language
    value
  }
  postalCode
  streetAddress
}

fragment TermReferenceFields on TermReference {
  id
  name {
    value
    language
  }
  alternateName {
    value
    language
  }
  sameAs
  authority
  fetchedAt
  dataset {
    ...DatasetReferenceFields
  }
}

fragment PublisherReferenceFields on PublisherReference {
  id
  name {
    value
    language
  }
}

fragment OccupationReferenceFields on OccupationReference {
  id
  name {
    value
    language
  }
  dataset {
    ...DatasetReferenceFields
  }
}

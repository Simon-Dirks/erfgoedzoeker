fragment PersonFields on Person {
  id
  name {
    value
    language
  }
  birthDate
  birthPlace {
    ...PlaceReferenceFields
  }
  deathDate
  deathPlace {
    ...PlaceReferenceFields
  }
  hasOccupation {
    ...OccupationReferenceFields
  }
  alternateName {
    value
    language
  }
  authority
  fetchedAt
}

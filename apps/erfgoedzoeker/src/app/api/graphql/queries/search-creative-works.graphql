query SearchCreativeWorks(
  $query: String
  $page: Int
  $perPage: Int
  $where: CreativeWorkWhere
  $orderBy: CreativeWorkOrderBy
) {
  creativeWorks(
    query: $query
    page: $page
    perPage: $perPage
    where: $where
    orderBy: $orderBy
  ) {
    items {
      ...CreativeWorkFields
    }
    pagination {
      total
      page
      perPage
    }
    facets {
      ...CreativeWorkFacetFields
    }
  }
}

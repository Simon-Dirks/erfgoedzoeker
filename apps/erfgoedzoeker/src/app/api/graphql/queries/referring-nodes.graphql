# TODO: Generate this automatically for all fields that refer to an IRI
query ReferringNodes($id: IRI!, $perPage: Int) {
  creativeWorks(
    where: {
      or: [
        { about: { in: [$id] } }
        { additionalType: { in: [$id] } }
        { genre: { in: [$id] } }
        { material: { in: [$id] } }
        { creator: { in: [$id] } }
        { contentLocation: { in: [$id] } }
        { locationCreated: { in: [$id] } }
        { dataset: { in: [$id] } }
        { isPartOf: { in: [$id] } }
      ]
    }
    page: 1
    perPage: $perPage
  ) {
    items {
      ...ReferringCreativeWorkFields
    }
    pagination {
      total
    }
  }
  datasets(where: { publisher: { in: [$id] } }, page: 1, perPage: $perPage) {
    items {
      ...ReferringDatasetFields
    }
    pagination {
      total
    }
  }
  occupations(where: { dataset: { in: [$id] } }, page: 1, perPage: $perPage) {
    items {
      ...ReferringOccupationFields
    }
    pagination {
      total
    }
  }
  organizations(
    where: { or: [{ dataset: { in: [$id] } }, { location: { in: [$id] } }] }
    page: 1
    perPage: $perPage
  ) {
    items {
      ...ReferringOrganizationFields
    }
    pagination {
      total
    }
  }
  persons(
    where: {
      or: [
        { birthPlace: { in: [$id] } }
        { deathPlace: { in: [$id] } }
        { hasOccupation: { in: [$id] } }
      ]
    }
    page: 1
    perPage: $perPage
  ) {
    items {
      ...ReferringPersonFields
    }
    pagination {
      total
    }
  }
  terms(where: { dataset: { in: [$id] } }, page: 1, perPage: $perPage) {
    items {
      ...ReferringTermFields
    }
    pagination {
      total
    }
  }
}

fragment ReferringCreativeWorkFields on CreativeWork {
  id
  type
  name {
    value
    language
  }
  associatedMedia {
    thumbnailUrl
  }
}

fragment ReferringDatasetFields on Dataset {
  id
  name {
    value
    language
  }
}

fragment ReferringOccupationFields on Occupation {
  id
  name {
    value
    language
  }
}

fragment ReferringOrganizationFields on Organization {
  id
  name {
    value
    language
  }
}

fragment ReferringPersonFields on Person {
  id
  name {
    value
    language
  }
}

fragment ReferringTermFields on Term {
  id
  name {
    value
    language
  }
}

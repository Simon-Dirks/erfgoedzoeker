# Erfgoedzoeker is a single-page app: every path that is not a file is a route,
# answered with index.html.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch index.html again, so a new release is picked up at once;
    # the files it loads have content hashes in their names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The configuration is mounted per instance and can change without a new
    # image. A missing file is a 404, not index.html, so a broken mount fails
    # loudly instead of as a JSON parse error.
    location /config/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

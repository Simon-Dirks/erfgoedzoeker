name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @erfgoedzoeker/config-schema --filter @erfgoedzoeker/icon-registry run build

      - name: Build app
        run: pnpm run build

      - name: Build docs
        run: pnpm run docs:build

      - name: Package build artifacts
        run: |
          tar -czf app.tar.gz -C apps/erfgoedzoeker/dist/erfgoedzoeker/browser .
          tar -czf docs.tar.gz -C docs/.vitepress/dist .

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: 'app.tar.gz,docs.tar.gz'
          target: '/tmp/erfgoedzoeker-deploy'
          strip_components: 0

      - name: Extract and publish on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_DIR=/var/www/erfgoedzoeker
            DOCS_DIR=/var/www/erfgoedzoeker-docs
            mkdir -p "$APP_DIR" "$DOCS_DIR"
            find "$APP_DIR" -mindepth 1 -delete
            find "$DOCS_DIR" -mindepth 1 -delete
            tar -xzf /tmp/erfgoedzoeker-deploy/app.tar.gz -C "$APP_DIR"
            tar -xzf /tmp/erfgoedzoeker-deploy/docs.tar.gz -C "$DOCS_DIR"
            rm -rf /tmp/erfgoedzoeker-deploy

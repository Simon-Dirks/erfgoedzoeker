name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      app-release-created: ${{ steps.release.outputs['apps/erfgoedzoeker--release_created'] }}
      app-version: ${{ steps.release.outputs['apps/erfgoedzoeker--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Publishes the app as a container image for every Erfgoedzoeker release,
  # tagged with its version and as latest. Runs here rather than on the tag,
  # because a tag pushed with GITHUB_TOKEN triggers no other workflow.
  docker-image:
    needs: release-please
    if: needs.release-please.outputs.app-release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/erfgoedzoeker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/simon-dirks/erfgoedzoeker:${{ needs.release-please.outputs.app-version }}
            ghcr.io/simon-dirks/erfgoedzoeker:latest
